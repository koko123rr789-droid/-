<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="16 8" opacity="0.6"/>
  
  <!-- Open Door & Sun Rays -->
  <path d="M176 120 L240 100 L240 400 L176 380 Z" fill="#ca8a04" opacity="0.4"/>
  <path d="M336 120 L272 100 L272 400 L336 380 Z" fill="#ca8a04" opacity="0.4"/>
  
  <!-- Central Pathway Sun -->
  <circle cx="256" cy="220" r="48" fill="url(#goldGrad)" />
  
  <!-- Graduation Cap -->
  <path d="M256 120 L380 180 L256 240 L132 180 Z" fill="url(#goldGrad)" />
  <rect x="240" y="240" width="32" height="48" rx="8" fill="#eab308" />
  <path d="M380 180 L380 260 C380 270 360 280 350 280" fill="none" stroke="#fef08a" stroke-width="6" />

  <!-- Road / Arrow forward -->
  <polygon points="256,290 286,390 226,390" fill="url(#goldGrad)" opacity="0.9" />
  
  <!-- Stars -->
  <polygon points="256,60 264,80 286,80 268,94 274,114 256,102 238,114 244,94 226,80 248,80" fill="#fde047"/>
</svg>
